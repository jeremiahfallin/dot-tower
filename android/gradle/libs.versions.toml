[versions]
# AGP 8.13.2 is the newest 8.x. compileSdk 36 needs AGP 8.9+, so this is the
# most conservative version that reaches the API level Google Play will require
# for updates from 2026-08-31. AGP 9.x is available but is a much larger jump.
agp = "8.13.2"
# Bevy's own example pins 4.4.0 with the note that this must stay compatible
# with the `android-activity` crate (0.6.1 here). A mismatch between the Java
# GameActivity and the vendored native glue fails at runtime, not build time,
# so this tracks Bevy's tested value rather than the newest release (4.4.2).
gamesActivity = "4.4.0"
appcompat = "1.7.0"
# Not a Kotlin project — this pins the stdlib only to break a duplicate-class
# collision. appcompat 1.7.0 -> lifecycle-common 2.6.2 ->
# kotlinx-coroutines-android 1.6.4 still asks for kotlin-stdlib-jdk7/jdk8 1.6.21,
# whose classes were merged into kotlin-stdlib itself in Kotlin 1.8.0. Alongside
# the 1.8.22 kotlin-stdlib already on the classpath that fails
# :app:checkDebugDuplicateClasses. At 1.8.22 the jdk7/jdk8 artifacts are empty
# shims delegating to kotlin-stdlib, so the duplicates vanish.
kotlin = "1.8.22"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
games-activity = { group = "androidx.games", name = "games-activity", version.ref = "gamesActivity" }
kotlin-stdlib-jdk7 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk7", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
