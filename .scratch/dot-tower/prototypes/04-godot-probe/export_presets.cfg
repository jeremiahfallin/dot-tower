; Android export preset for the probe harness.
;
; Deliberately minimal: Godot fills every option it does not find here from the
; exporter's own defaults, and a hand-written preset that enumerates all of them
; goes stale on the next engine version. scripts/run.sh drives this over the CLI.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/dot-tower-probe.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

package/unique_name="dev.dottower.godotprobe"
package/name="dot-tower probe"
package/signed=true
; The Pixel 10 Pro is arm64. Building the other three costs time and proves
; nothing, and the harness is only ever installed by hand.
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86_64=false
architectures/x86=false
; Edge-to-edge, so probe C has real insets to report rather than a window the
; system has already inset for us.
screen/immersive_mode=true
; false uses Godot's prebuilt template, which is what makes this a one-command
; export with no Gradle in the loop. It also means targetSdk is whatever the
; template ships — fine for a probe, and the thing to revisit before any Play
; Store upload (API 36 required from 2026-08-31). See README, "What this does
; not prove".
gradle_build/use_gradle_build=false
